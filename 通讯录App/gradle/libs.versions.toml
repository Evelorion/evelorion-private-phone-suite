# 版本表。数值全部沿用已经验证过能编译的那一套，不要"顺手升个版本"——
# AGP / Kotlin / KSP 三者的兼容窗口很窄，升错一个就是一轮排查。

[versions]
kotlin = "2.3.10"
ksp = "2.3.6"
agp = "9.1.0"

# AndroidX
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
activity = "1.9.3"
lifecycle = "2.8.7"
room = "2.8.4"
work = "2.10.0"
securityCrypto = "1.1.0-alpha06"
androidxSqlite = "2.4.0"

# 数据层：只拿它读写系统通讯录和做 vCard，不用它的任何 UI
commons = "6.1.6"

# 加密同步
okhttp = "4.12.0"
argon2kt = "1.6.0"
sqlcipher = "4.6.1"

# 测试
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# 构建
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
javaVersion = "VERSION_17"
jvmTarget = "17"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }

fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[bundles]
room = ["androidx-room-runtime", "androidx-room-ktx"]

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
