# 版本表。AGP / Kotlin / KSP / Compose 编译器四者的兼容窗口很窄，
# 这套数值和通讯录工程保持一致 —— 那一套是验证过能编译的。

[versions]
kotlin = "2.3.10"
ksp = "2.3.6"
agp = "9.1.0"

# Compose。BOM 统一管住各 compose 库的版本，单独写版本号迟早对不上。
composeBom = "2024.09.03"
activityCompose = "1.9.3"

coreKtx = "1.15.0"
lifecycle = "2.8.7"
room = "2.8.4"
work = "2.10.0"
androidxSqlite = "2.4.0"

# 加密同步（和通讯录同一套实现，密钥体系必须一致）
okhttp = "4.12.0"
argon2kt = "1.6.0"
sqlcipher = "4.6.1"

compileSdk = "36"
targetSdk = "36"
minSdk = "26"
javaVersion = "VERSION_17"
jvmTarget = "17"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-animation = { module = "androidx.compose.animation:animation" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

[bundles]
compose = [
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-animation",
]
room = ["androidx-room-runtime", "androidx-room-ktx"]

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
